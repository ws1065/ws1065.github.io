<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe6d3">
<title>汉东仕途 · 人民的名义同人策略游戏</title>
<meta name="description" content="《汉东仕途》是一款基于《人民的名义》背景设定的单文件网页策略游戏：从科员到中央政治局常委，二十个路口，六十四段故事。">
<link rel="icon" href="data:,">
<style>
  :root{
    --paper:#efe6d3; --paper-2:#e6dac2; --ink:#2b2117; --ink-2:#4a3b2c;
    --seal:#a3352b; --line:rgba(43,33,23,.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
    display:flex; align-items:center; justify-content:center; padding:32px 20px;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(163,53,43,.06), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(43,33,23,.07), transparent 46%);
  }
  main{width:100%; max-width:640px;}
  .brand{display:flex; align-items:center; gap:10px; letter-spacing:.28em; font-size:12px; color:var(--ink-2);}
  .brand__seal{
    width:34px;height:34px;border:1.5px solid var(--seal);border-radius:6px;color:var(--seal);
    display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:0;
    font-weight:700;
  }
  h1{font-size:clamp(40px,9vw,64px); letter-spacing:.14em; margin:26px 0 6px; font-weight:600;}
  .sub{margin:0 0 22px; color:var(--ink-2); letter-spacing:.18em; font-size:14px;}
  p.lede{line-height:2; color:var(--ink-2); font-size:15px; margin:0 0 28px;}
  .enter{
    display:inline-flex; align-items:center; gap:12px;
    background:var(--seal); color:#f7efe0; text-decoration:none;
    padding:15px 30px; border-radius:10px; letter-spacing:.2em; font-size:15px;
    box-shadow:0 10px 26px rgba(163,53,43,.22);
  }
  .enter:hover{background:#8d2d24;}
  .rule{height:1px; background:var(--line); margin:34px 0 18px;}
  footer{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:12.5px; color:var(--ink-2); opacity:.85;}
  footer a{color:inherit;}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="brand__seal">汉东</span><span>汉东省 · 京州市 · 二〇一〇</span></div>

  <h1>汉东仕途</h1>
  <p class="sub">一纸调令，半生沉浮</p>

  <p class="lede">
    二〇一〇年，你走出校门，进入汉东省京州市的机关大院。此后三十余年，六十四段故事里，二十个路口会依次到来。<br>
    每个路口背后有三十种走法，但每次只给你三条；换一局，场景与选项都会不同。<br>
    从科员到中央政治局常委，反腐风暴、城市开发、派系博弈将轮番从你身边经过。
  </p>

  <a class="enter" href="https://ws1065.github.io/handong-shitu/">踏入仕途 <span aria-hidden="true">→</span></a>

  <div class="rule"></div>

  <footer>
    <span>非商业同人作品，背景取自周梅森《人民的名义》</span>
    <a href="https://ws1065.github.io/handong-shitu/">开始游戏</a>
    <a href="privacy.html">隐私政策</a>
    <a href="https://github.com/ws1065/handong-shitu">GitHub</a>
  </footer>
</main>
</body>
</html>
